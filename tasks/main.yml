---
# tasks file for nginx-role
#
 - name: Install nginx
   apt:
     name: nginx
     state: present
   when: ansible_os_family == "Debian"

 - name: Copy nginx config
   template:
     src: nginx.conf.j2
     dest: /etc/nginx/nginx.conf
   notify: Restart nginx

 - name: Copy index file
   template:
     src: index.html.j2
     dest: /var/www/html/index.html
   notify: Restart nginx
